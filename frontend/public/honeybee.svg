<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Honey Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Wing Cyan Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Honeycomb Hexagon Background Accent -->
  <polygon points="256,42 426,140 426,336 256,434 86,336 86,140" fill="none" stroke="url(#amberGrad)" stroke-width="14" stroke-opacity="0.35" />
  <polygon points="256,70 401,154 401,322 256,406 111,322 111,154" fill="none" stroke="url(#amberGrad)" stroke-width="6" stroke-opacity="0.18" />

  <!-- BEE BODY & DESIGN -->
  <g filter="url(#glow)">
    <!-- Bee Left Wing (Stylized Code Bracket <) -->
    <path d="M 210,190 Q 110,130 130,240 Q 150,300 220,260 Z" fill="url(#wingGrad)"/>
    <path d="M 195,215 L 140,240 L 195,265" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- Bee Right Wing (Stylized Code Bracket >) -->
    <path d="M 302,190 Q 402,130 382,240 Q 362,300 292,260 Z" fill="url(#wingGrad)"/>
    <path d="M 317,215 L 372,240 L 317,265" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- Bee Abdomen / Body -->
    <ellipse cx="256" cy="275" rx="55" ry="85" fill="url(#amberGrad)"/>
    
    <!-- Dark Stripes -->
    <path d="M 205,245 C 235,255 277,255 307,245 C 309,255 309,265 307,275 C 277,285 235,285 205,275 Z" fill="#0F172A"/>
    <path d="M 212,295 C 238,305 274,305 300,295 C 298,307 292,317 282,327 C 266,333 246,333 230,327 C 220,317 214,307 212,295 Z" fill="#0F172A"/>

    <!-- Bee Head & Antennae -->
    <circle cx="256" cy="165" r="38" fill="#1E293B" stroke="url(#amberGrad)" stroke-width="6"/>
    
    <!-- Eyes -->
    <circle cx="240" cy="160" r="7" fill="#FCD34D"/>
    <circle cx="272" cy="160" r="7" fill="#FCD34D"/>

    <!-- Antennae -->
    <path d="M 244,132 Q 230,100 215,105" fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="213" cy="105" r="6" fill="#FCD34D"/>
    
    <path d="M 268,132 Q 282,100 297,105" fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="299" cy="105" r="6" fill="#FCD34D"/>

    <!-- Stinger -->
    <polygon points="256,365 247,388 265,388" fill="#F59E0B"/>
  </g>
</svg>
