version: '3.8'

services:
  backend:
    build:
      context: .
      target: production
    image: ${DOCKERHUB_USERNAME}/codehive-backend:latest
    container_name: codehive-backend
    restart: unless-stopped
    expose:
      - "5000"
      - "1234"
    env_file:
      - .env
    networks:
      - codehive-network

  nginx:
    image: nginx:alpine
    container_name: codehive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - codehive-network

networks:
  codehive-network:
    driver: bridge

